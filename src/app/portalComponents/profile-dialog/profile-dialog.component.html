<h2 mat-dialog-title data-testid="profile.dialog.title.text">{{ 'lblProfile' | translate }}</h2>

<mat-dialog-content>
  <div class="profile-container">
    @for (prop of userProfileProps; track $index) {
      @if (prop.value) {
        <div class="profile-row">
          <div class="profile-key">{{ prop.label }}:</div>
          <div class="profile-value">{{ prop.value }}</div>
        </div>
      }
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button data-testid="profile.dialog.close.button" mat-raised-button color="primary" (click)="closeDialog()">
    {{ 'lblClose' | translate }}
  </button>
</mat-dialog-actions>

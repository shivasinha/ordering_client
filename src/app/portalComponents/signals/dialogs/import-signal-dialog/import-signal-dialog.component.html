<h2 mat-dialog-title data-testid="signals.import-dialog.title.text">{{ 'lblImportSignal' | translate }}</h2>

<mat-dialog-content>
  @if (!hasProcessedResults()) {
    <div class="upload-section">
      <input type="file" accept=".csv" data-testid="signals.import-dialog.file.input" (change)="onFileSelected($event)" />
      @if (selectedFile()) {
        <p>{{ selectedFile()?.name }}</p>
      }
    </div>
  } @else {
    <table mat-table [dataSource]="results()" class="full-width">
      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef data-testid="signals.import-dialog.header-area">{{ 'lblArea' | translate }}</th>
        <td mat-cell *matCellDef="let element; let i = index" [attr.data-testid]="'signals.import-dialog.cell-area-' + i">
          {{ element.area }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef data-testid="signals.import-dialog.header-status">{{ 'lblStatus' | translate }}</th>
        <td mat-cell *matCellDef="let element; let i = index" [attr.data-testid]="'signals.import-dialog.cell-status-' + i">
          {{ element.status }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['area', 'status']"></tr>
      <tr
        mat-row
        *matRowDef="let row; let i = index; columns: ['area', 'status']"
        [attr.data-testid]="'signals.import-dialog.row-' + i"
      ></tr>
    </table>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button data-testid="signals.import-dialog.cancel.button" mat-button (click)="onCancel()">
    {{ 'lblCancel' | translate }}
  </button>

  @if (!hasProcessedResults()) {
    <button data-testid="signals.import-dialog.start.button" mat-button color="primary" [disabled]="!canStart()" (click)="onStart()">
      {{ 'lblStart' | translate }}
    </button>
  } @else {
    <button
      data-testid="signals.import-dialog.apply.button"
      mat-button
      color="primary"
      [disabled]="acceptedSignals().length === 0"
      (click)="onApply()"
    >
      {{ 'lblApply' | translate }}
    </button>
  }
</mat-dialog-actions>
